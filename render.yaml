# Render blueprint: one web service runs the whole app.
#
# The Express server serves the built React client (see createApp's serveClient)
# and the client calls /api on the same origin, so there is nothing else to
# host. On Render's own *.onrender.com address there are no per-school
# subdomains, so a school is reached at  https://<app>.onrender.com/?school=<slug> .
#
# Free plan: the disk is ephemeral, so schools created here reset on redeploy or
# after the service sleeps. For data that lasts, move to a paid instance with a
# disk mounted at /data and set SMS_DB_PATH=/data/school.db and
# SMS_REGISTRY_PATH=/data/registry.db.
services:
  - type: web
    name: school-management-system
    runtime: node
    plan: free
    # NODE_ENV=production makes npm skip devDependencies, but the client build
    # needs vite (a devDependency), so force it in for that install. The server
    # runs on production deps only.
    buildCommand: npm --prefix client install --include=dev && npm --prefix client run build && npm --prefix server install
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Signed per deploy; every session is invalidated if it rotates.
      - key: JWT_SECRET
        generateValue: true
      # Seed a full demo school into the empty database on boot, and open the
      # one-click pupil sign-in, so the root URL is a live, explorable school.
      - key: SEED_DEMO
        value: "true"
